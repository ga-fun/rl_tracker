name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Install dependencies
        run: dotnet restore RlTracker.slnx
      
      - name: Build solution
        run: dotnet build RlTracker.slnx --configuration Release --no-restore
      
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ga-fun
            -Dsonar.projectKey=rl_tracker
            -Dsonar.projectName=rl_tracker
            -Dsonar.sources=src
            -Dsonar.cs.vscoveragexml.reportsPaths=**/coverage.xml
